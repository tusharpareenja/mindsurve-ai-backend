[project]
name = "mindsurve-ai-backend"
version = "0.1.0"
description = "MindSurve API — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "openai>=1.50.0",
    "azure-storage-blob>=12.23.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
